name: offline-maintained-contracts
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/check_structure.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync dafc reproduce
      - run: uv build --out-dir dist
      - run: uv run --no-sync python scripts/check_release.py
      - run: uv run --no-sync python scripts/check_sdist.py
