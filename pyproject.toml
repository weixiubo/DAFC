[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "dafc"
version = "0.1.0"
description = "Typed selective routing for outcome-validated GUI action reuse"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy==2.4.4", "opencv-python==4.13.0.92", "Pillow==12.2.0"]
[project.optional-dependencies]
browser = ["miniwob==1.0", "playwright==1.60.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
