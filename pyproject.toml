[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dafc"
version = "0.2.0"
description = "Typed selective routing for outcome-validated GUI action reuse"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = ["numpy==2.4.4", "opencv-python==4.13.0.92", "Pillow==12.2.0", "PyYAML==6.0.3"]

[project.scripts]
dafc = "dafc.cli:main"

[project.optional-dependencies]
browser = ["miniwob==1.0", "playwright==1.60.0"]
inference = ["torch>=2.6,<3", "transformers>=4.57,<5", "accelerate>=1.6,<2", "qwen-vl-utils>=0.0.11,<1"]
lightglue = ["torch>=2.6,<3", "torchvision>=0.21,<1", "kornia>=0.6.11,<1", "matplotlib>=3.9,<4"]
android = [
  "absl-py==2.1.0", "android_env==1.2.3", "dm_env==1.6", "fuzzywuzzy==0.18.0",
  "google-generativeai>=0.8,<1", "grpcio-tools==1.71.0", "protobuf==5.29.5",
  "immutabledict==2.0.0", "IPython>=8,<10", "jsonschema==4.17.3",
  "matplotlib>=3.9,<4", "pandas>=2.2,<3", "pydub==0.25.1",
  "python-Levenshtein>=0.26,<1", "requests>=2.32,<3", "tenacity>=9,<10", "termcolor>=2,<4"
]


[dependency-groups]
dev = ["pytest==8.4.2", "pytest-subtests==0.15.0", "ruff==0.16.10", "mypy==1.20.2", "types-PyYAML==6.0.12.20250915", "build==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dafc = ["py.typed", "resource_catalog.json", "evidence_data/*"]

[tool.pytest.ini_options]
norecursedirs = ["reference", ".*", "build", "dist", "*.egg"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/reference", "reproduce", "build", "dist", "src/dafc/evidence_data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/dafc/resources.py", "src/dafc/configuration.py", "src/dafc/run_state.py", "src/dafc/jobs/parameter_types.py", "src/dafc/jobs/service_identity.py"]
follow_imports = "silent"
